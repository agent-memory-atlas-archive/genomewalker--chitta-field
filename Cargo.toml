[package]
name = "chitta-field"
version = "2.7.12"
edition = "2021"
build = "build.rs"
description = "Organic associative memory substrate for cognitive AI companions"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sha2 = "0.10"
rmp-serde = "=1.1.2"
rmp = "=0.8.14"
serde = { version = "1", features = ["derive"] }
# Ledger REAL timestamps must round-trip through domain-event JSON exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
bincode = "1"
byteorder = "1.5"
crc32fast = "1.4"
memmap2 = "0.9"
thiserror = "1"
log = "0.4"
parking_lot = "0.12"
turbovec = "0.9"
anyhow = "1"
roaring = { version = "0.10", features = ["serde"] }
rayon = "1"
smallvec = { version = "1", features = ["union", "serde"] }
libc = "0.2"
pyo3 = { version = "0.22", features = ["auto-initialize"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "span_backfill"
path = "src/bin/span_backfill.rs"

[[bin]]
name = "bench"
path = "benches/recall_bench.rs"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "write_bench"
harness = false

[[bench]]
name = "wal_replay_bench"
harness = false

[features]
# Debug/CI aid: parking_lot deadlock detection. ChittaField::open spawns a
# checker thread that dumps any deadlock cycle to stderr and aborts.
# Never enable in production builds (per-lock bookkeeping overhead).
deadlock-detection = ["parking_lot/deadlock_detection"]

[profile.release]
lto = true
codegen-units = 1
